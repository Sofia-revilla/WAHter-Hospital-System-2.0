# WAHter on one machine: Postgres, RabbitMQ, the ten services, Kong, nginx,
# and the web app. Copy .env.example to .env, run `docker compose up --build`,
# then open http://localhost:8080.
name: wahter

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-build: &build
  context: .
  dockerfile: infra/docker/service.Dockerfile

x-bus: &bus
  RABBITMQ_URL: amqp://wahter:${RABBITMQ_PASSWORD:?copy .env.example to .env}@rabbitmq:5672
  JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wahter
      POSTGRES_USER: wahter_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      ACCESS_PROVIDER_REGISTRY_DB_PASSWORD: ${ACCESS_PROVIDER_REGISTRY_DB_PASSWORD}
      PATIENT_REGISTRY_DB_PASSWORD: ${PATIENT_REGISTRY_DB_PASSWORD}
      PATIENT_FLOW_DB_PASSWORD: ${PATIENT_FLOW_DB_PASSWORD}
      CLINICAL_CARE_DB_PASSWORD: ${CLINICAL_CARE_DB_PASSWORD}
      DIAGNOSTICS_DB_PASSWORD: ${DIAGNOSTICS_DB_PASSWORD}
      PHARMACY_DB_PASSWORD: ${PHARMACY_DB_PASSWORD}
      BILLING_REVENUE_CYCLE_DB_PASSWORD: ${BILLING_REVENUE_CYCLE_DB_PASSWORD}
      INTEROPERABILITY_REPORTING_DB_PASSWORD: ${INTEROPERABILITY_REPORTING_DB_PASSWORD}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
      AUDIT_LOG_DB_PASSWORD: ${AUDIT_LOG_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # 5433 on the host so it doesn't clash with a locally installed Postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wahter_admin -d wahter"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: wahter
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?copy .env.example to .env}
    # management UI at http://localhost:15672 to watch the queues
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ─── the ten services (paper TABLE IV) ───

  access-provider-registry:
    <<: *service
    build: { <<: *build, args: { SERVICE: access-provider-registry } }
    environment:
      <<: *bus
      DATABASE_URL: postgres://access_provider_registry_svc:${ACCESS_PROVIDER_REGISTRY_DB_PASSWORD}@postgres:5432/wahter

  patient-registry:
    <<: *service
    build: { <<: *build, args: { SERVICE: patient-registry } }
    environment:
      <<: *bus
      DATABASE_URL: postgres://patient_registry_svc:${PATIENT_REGISTRY_DB_PASSWORD}@postgres:5432/wahter

  patient-flow:
    <<: *service
    build: { <<: *build, args: { SERVICE: patient-flow } }
    environment:
      <<: *bus
      DATABASE_URL: postgres://patient_flow_svc:${PATIENT_FLOW_DB_PASSWORD}@postgres:5432/wahter

  clinical-care:
    <<: *service
    build: { <<: *build, args: { SERVICE: clinical-care } }
    environment:
      <<: *bus
      DATABASE_URL: postgres://clinical_care_svc:${CLINICAL_CARE_DB_PASSWORD}@postgres:5432/wahter

  diagnostics:
    <<: *service
    build: { <<: *build, args: { SERVICE: diagnostics } }
    environment:
      <<: *bus
      DATABASE_URL: postgres://diagnostics_svc:${DIAGNOSTICS_DB_PASSWORD}@postgres:5432/wahter

  pharmacy:
    <<: *service
    build: { <<: *build, args: { SERVICE: pharmacy } }
    environment:
      <<: *bus
      DATABASE_URL: postgres://pharmacy_svc:${PHARMACY_DB_PASSWORD}@postgres:5432/wahter

  billing-revenue-cycle:
    <<: *service
    build: { <<: *build, args: { SERVICE: billing-revenue-cycle } }
    environment:
      <<: *bus
      DATABASE_URL: postgres://billing_revenue_cycle_svc:${BILLING_REVENUE_CYCLE_DB_PASSWORD}@postgres:5432/wahter

  interoperability-reporting:
    <<: *service
    build: { <<: *build, args: { SERVICE: interoperability-reporting } }
    environment:
      <<: *bus
      DATABASE_URL: postgres://interoperability_reporting_svc:${INTEROPERABILITY_REPORTING_DB_PASSWORD}@postgres:5432/wahter

  notifications:
    <<: *service
    build: { <<: *build, args: { SERVICE: notifications } }
    environment:
      <<: *bus
      DATABASE_URL: postgres://notifications_svc:${NOTIFICATIONS_DB_PASSWORD}@postgres:5432/wahter

  audit-log:
    <<: *service
    build: { <<: *build, args: { SERVICE: audit-log } }
    environment:
      <<: *bus
      DATABASE_URL: postgres://audit_log_svc:${AUDIT_LOG_DB_PASSWORD}@postgres:5432/wahter

  # ─── edge ───

  kong:
    image: kong:3.9
    restart: unless-stopped
    command: ["sh", "/etc/kong/wahter/start.sh"]
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # Recreated containers get new IPs. With Kong's default DNS caching it
      # kept sending traffic to the old addresses, which by then belonged to
      # other services, so re-resolve often.
      KONG_DNS_VALID_TTL: "10"
      # A stopped container has no DNS name, and Kong remembers "not found"
      # for 30s by default, so a restarted service looked down for 30s more.
      KONG_DNS_NOT_FOUND_TTL: "5"
      KONG_DNS_ERROR_TTL: "1"
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./infra/kong:/etc/kong/wahter:ro
    depends_on:
      - access-provider-registry
      - patient-registry
      - patient-flow
      - clinical-care
      - diagnostics
      - pharmacy
      - billing-revenue-cycle
      - interoperability-reporting
      - notifications
      - audit-log

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # same origin through nginx, so the browser never needs Kong's address
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ENABLE_DEMO: ${ENABLE_DEMO:-false}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - kong
      - web

volumes:
  pgdata:

# the paper's network name (TABLE IX deployment), instead of compose's "wahter_default"
networks:
  default:
    name: wah-net
