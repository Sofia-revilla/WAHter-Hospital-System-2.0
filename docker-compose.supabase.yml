      DATABASE_URL: postgres://diagnostics_svc.${SUPABASE_PROJECT_REF:?run npm run supabase:setup}:${SUPABASE_DIAGNOSTICS_DB_PASSWORD:?run npm run supabase:setup}@${SUPABASE_POOLER_HOST}:5432/postgres
      DATABASE_SSL: require

  pharmacy:
    <<: *supabase
    environment:
      DATABASE_URL: postgres://pharmacy_svc.${SUPABASE_PROJECT_REF:?run npm run supabase:setup}:${SUPABASE_PHARMACY_DB_PASSWORD:?run npm run supabase:setup}@${SUPABASE_POOLER_HOST}:5432/postgres
      DATABASE_SSL: require

  billing-revenue-cycle:
    <<: *supabase
    environment:
      DATABASE_URL: postgres://billing_revenue_cycle_svc.${SUPABASE_PROJECT_REF:?run npm run supabase:setup}:${SUPABASE_BILLING_REVENUE_CYCLE_DB_PASSWORD:?run npm run supabase:setup}@${SUPABASE_POOLER_HOST}:5432/postgres
      DATABASE_SSL: require

  interoperability-reporting:
    <<: *supabase
    environment:
      DATABASE_URL: postgres://interoperability_reporting_svc.${SUPABASE_PROJECT_REF:?run npm run supabase:setup}:${SUPABASE_INTEROPERABILITY_REPORTING_DB_PASSWORD:?run npm run supabase:setup}@${SUPABASE_POOLER_HOST}:5432/postgres
      DATABASE_SSL: require

  notifications:
    <<: *supabase
    environment:
      DATABASE_URL: postgres://notifications_svc.${SUPABASE_PROJECT_REF:?run npm run supabase:setup}:${SUPABASE_NOTIFICATIONS_DB_PASSWORD:?run npm run supabase:setup}@${SUPABASE_POOLER_HOST}:5432/postgres
      DATABASE_SSL: require

  audit-log:
