# Same stack, but every service keeps its data on Supabase instead of the local
# postgres container. Run `npm run supabase:setup` once first, then
# `npm run up:supabase`. Plain `docker compose up` still uses the local database.
#
# Supabase's session pooler takes logins as <role>.<project-ref>, so each
# service still signs in as its own role and only sees its own schema.

x-supabase: &supabase
  depends_on: !override
    rabbitmq:
      condition: service_healthy

services:
  access-provider-registry:
    <<: *supabase
    environment:
      DATABASE_URL: postgres://access_provider_registry_svc.${SUPABASE_PROJECT_REF:?run npm run supabase:setup}:${SUPABASE_ACCESS_PROVIDER_REGISTRY_DB_PASSWORD:?run npm run supabase:setup}@${SUPABASE_POOLER_HOST}:5432/postgres
      DATABASE_SSL: require

  patient-registry:
    <<: *supabase
    environment:
      DATABASE_URL: postgres://patient_registry_svc.${SUPABASE_PROJECT_REF:?run npm run supabase:setup}:${SUPABASE_PATIENT_REGISTRY_DB_PASSWORD:?run npm run supabase:setup}@${SUPABASE_POOLER_HOST}:5432/postgres
      DATABASE_SSL: require

  patient-flow:
    <<: *supabase
    environment:
      DATABASE_URL: postgres://patient_flow_svc.${SUPABASE_PROJECT_REF:?run npm run supabase:setup}:${SUPABASE_PATIENT_FLOW_DB_PASSWORD:?run npm run supabase:setup}@${SUPABASE_POOLER_HOST}:5432/postgres
      DATABASE_SSL: require

  clinical-care:
    <<: *supabase
    environment:
      DATABASE_URL: postgres://clinical_care_svc.${SUPABASE_PROJECT_REF:?run npm run supabase:setup}:${SUPABASE_CLINICAL_CARE_DB_PASSWORD:?run npm run supabase:setup}@${SUPABASE_POOLER_HOST}:5432/postgres
      DATABASE_SSL: require

  diagnostics:
