# Kong in DB-less mode: this file is the whole gateway config.
# start.sh swaps __JWT_SECRET__ for the real value at container start, so
# the secret lives only in .env.
_format_version: "3.0"

consumers:
  # Access & Provider Registry is the only token issuer; its tokens carry
  # iss = wahter-access
  - username: wahter-staff
    jwt_secrets:
      - key: wahter-access
        secret: __JWT_SECRET__
        algorithm: HS256

plugins:
  # nginx serves the app from the same origin, but two callers come from
  # elsewhere: `npm run dev:web` on :3000/:3001, and the Vercel site when it's
  # pointed at this stack through the demo tunnel (see README)
  - name: cors
    config:
      # the last entry is a regex: the main Vercel address plus every
      # deployment and preview link (wahter-hospital-system-<id>-....vercel.app)
      origins:
        - "http://localhost:3000"
        - "http://localhost:3001"
        - "http://localhost:8080"
        - 'https://wahter-hospital-system(-[a-z0-9-]+)?\.vercel\.app'
      methods: [GET, POST, PATCH, OPTIONS]
      headers: [Authorization, Content-Type]
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 600
      policy: local
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

# Short timeouts on purpose: Kong's defaults (60s, 5 retries) left the app
# waiting a full minute on a stopped container before reporting it down.
# 2s connect x 2 tries means a stopped service shows as offline within ~4s.
services:
  - name: access-provider-registry
    url: http://access-provider-registry:3000
    connect_timeout: 2000
    read_timeout: 15000
    write_timeout: 15000
    retries: 1
    routes:
      - name: access-provider-registry-public
        paths: [/api/access-provider-registry/auth, /api/access-provider-registry/health, /api/access-provider-registry/docs]
        strip_path: false
      - name: access-provider-registry
        paths: [/api/access-provider-registry]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
              run_on_preflight: false

  - name: patient-registry
