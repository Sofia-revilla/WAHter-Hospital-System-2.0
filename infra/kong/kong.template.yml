# GENERATED by infra/kong/generate.mjs from routes.mjs. Edit routes.mjs and run
# `npm run kong:generate`, don't edit this file by hand.
#
# Kong in DB-less mode: this file is the whole gateway config. start.sh swaps
# __JWT_SECRET__ and __GATEWAY_LOG_SECRET__ for the real values at start-up,
# so the secrets live only in .env.
_format_version: "3.0"

# One consumer per role. A token's `rk` claim names its consumer, and the
# consumer's ACL group is what the per-route allow lists check.
consumers:
  - username: role-admittingclerk
    jwt_secrets:
      - key: role-admittingclerk
        secret: __JWT_SECRET__
        algorithm: HS256
    acls:
      - group: AdmittingClerk
  - username: role-physician
    jwt_secrets:
      - key: role-physician
        secret: __JWT_SECRET__
        algorithm: HS256
    acls:
      - group: Physician
  - username: role-nurse
    jwt_secrets:
      - key: role-nurse
        secret: __JWT_SECRET__
        algorithm: HS256
    acls:
      - group: Nurse
  - username: role-pharmacist
    jwt_secrets:
      - key: role-pharmacist
        secret: __JWT_SECRET__
        algorithm: HS256
    acls:
      - group: Pharmacist
  - username: role-laboratorystaff
    jwt_secrets:
      - key: role-laboratorystaff
        secret: __JWT_SECRET__
        algorithm: HS256
    acls:
      - group: LaboratoryStaff
  - username: role-radiologystaff
    jwt_secrets:
      - key: role-radiologystaff
        secret: __JWT_SECRET__
        algorithm: HS256
    acls:
      - group: RadiologyStaff
  - username: role-billingstaff
    jwt_secrets:
      - key: role-billingstaff
        secret: __JWT_SECRET__
        algorithm: HS256
    acls:
      - group: BillingStaff
  - username: role-hospitaladministrator
    jwt_secrets:
      - key: role-hospitaladministrator
        secret: __JWT_SECRET__
        algorithm: HS256
    acls:
      - group: HospitalAdministrator
  - username: role-systemadministrator
    jwt_secrets:
      - key: role-systemadministrator
        secret: __JWT_SECRET__
        algorithm: HS256
    acls:
      - group: SystemAdministrator

plugins:
  # nginx serves the app from the same origin, but two callers come from
  # elsewhere: `npm run dev:web` on :3000/:3001, and the Vercel site when it's
  # pointed at this stack through the demo tunnel (see README)
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:3001"
        - "http://localhost:8080"
        - 'https://wahter-hospital-system(-[a-z0-9-]+)?\.vercel\.app'
      methods: [GET, POST, PATCH, OPTIONS]
      headers: [Authorization, Content-Type]
      exposed_headers: [Content-Disposition, X-Row-Limit-Hit]
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 600
      policy: local
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
  # US-41: Kong's 401s and 403s never reach a service, so Kong reports every
  # request to the Audit Log, which keeps only the denied ones
  - name: http-log
    config:
      http_endpoint: http://audit-log:3000/api/audit-log/internal/gateway-log
      method: POST
      headers:
        X-Gateway-Secret: __GATEWAY_LOG_SECRET__
      queue:
        max_batch_size: 20
        max_coalescing_delay: 2

# Short timeouts on purpose: Kong's defaults (60s, 5 retries) left the app
# waiting a full minute on a stopped container before reporting it down.
services:
  - name: access-provider-registry
    url: http://access-provider-registry:3000
    connect_timeout: 2000
    read_timeout: 15000
    write_timeout: 15000
    retries: 1
    routes:
      - name: access-provider-registry-public
        paths: [/api/access-provider-registry/auth/login, /api/access-provider-registry/auth/verify, /api/access-provider-registry/auth/demo, /api/access-provider-registry/auth/refresh, /api/access-provider-registry/health, /api/access-provider-registry/docs]
        strip_path: false
      - name: access-provider-registry-logout
        methods: [POST, OPTIONS]
        paths: ['/api/access-provider-registry/auth/logout']
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: rk
              claims_to_verify: [exp]
              run_on_preflight: false
          - name: acl
            config:
              allow: [AdmittingClerk, Physician, Nurse, Pharmacist, LaboratoryStaff, RadiologyStaff, BillingStaff, HospitalAdministrator, SystemAdministrator]
              hide_groups_header: true
      - name: access-provider-registry-accounts
        methods: [GET, POST, PATCH, OPTIONS]
        paths: ['/api/access-provider-registry/accounts']
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: rk
              claims_to_verify: [exp]
              run_on_preflight: false
          - name: acl
            config:
              allow: [SystemAdministrator]
              hide_groups_header: true
      - name: access-provider-registry-approvals
