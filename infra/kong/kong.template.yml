# Kong in DB-less mode: this file is the whole gateway config.
# start.sh swaps __JWT_SECRET__ for the real value at container start, so
# the secret lives only in .env.
_format_version: "3.0"

consumers:
  # Identity is the only token issuer; its tokens carry iss = wahter-identity
  - username: wahter-staff
    jwt_secrets:
      - key: wahter-identity
        secret: __JWT_SECRET__
        algorithm: HS256

plugins:
  # the app is served through the same nginx origin, but `npm run dev:web`
  # on :3000 calls the gateway on :8080, so CORS has to allow that
  - name: cors
    config:
      origins: ["http://localhost:3000", "http://localhost:3001", "http://localhost:8080"]
      methods: [GET, POST, PATCH, OPTIONS]
      headers: [Authorization, Content-Type]
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 600
      policy: local
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

services:
  # Short timeouts on purpose: Kong's defaults (60s, 5 retries) left the app
  # waiting a full minute on a stopped container before reporting it down.
  - name: identity
    url: http://identity:3000
    connect_timeout: 3000
    read_timeout: 15000
    write_timeout: 15000
    retries: 1
    routes:
      - name: identity-public
        # no token needed: login, refresh, health checks, and API docs
        paths: [/api/identity/auth, /api/identity/health, /api/identity/docs]
        strip_path: false
      - name: identity
        paths: [/api/identity]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
              run_on_preflight: false
